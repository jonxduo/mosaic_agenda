name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (fixed proptest seed)
        run: cargo test --workspace
        env:
          PROPTEST_RNG_SEED: "20261101"
      - name: Tests (random proptest seed)
        run: cargo test --workspace
      - name: Schema is up to date
        run: cargo xtask schema --check
      - name: Validate every package
        run: cargo xtask validate --all
      - name: Bundle every package
        run: for p in packages/*/; do cargo xtask bundle --package "$(basename "$p")"; done
      - name: No domain terms in the core
        run: cargo xtask check-domain-leak
      - name: Package scenarios
        run: for p in packages/*/; do cargo xtask test-package --package "$(basename "$p")"; done
      - name: TypeScript bindings are up to date
        run: cargo xtask bindings --check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI dependencies
        run: npx -y pnpm@10.34.9 install --frozen-lockfile
      - name: Type check
        run: npx -y pnpm@10.34.9 --dir apps/app/ui run check
      - name: Build
        run: npx -y pnpm@10.34.9 --dir apps/app/ui run build
      - name: Playwright browsers
        run: npx -y pnpm@10.34.9 --dir apps/app/ui exec playwright install --with-deps chromium
      - name: End-to-end tests (three local devices)
        run: npx -y pnpm@10.34.9 --dir apps/app/ui run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/app/ui/playwright-report

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop build for every package
        run: for p in packages/*/; do cargo xtask build --package "$(basename "$p")" --target desktop; done

  server:
    # F6: the support server from `docker compose up`, and three app cores
    # syncing through its relay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - name: Start relay and push service
        working-directory: server/deploy
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build iroh-relay push-service
          for i in $(seq 1 60); do curl -fsS http://localhost:3340/ping && curl -fsS http://localhost:8080/health && break; sleep 5; done
          curl -fsS http://localhost:8080/health
      - name: Push service tests
        run: cargo test -p push-service -p core-push
      - name: Three devices over the own relay
        run: cargo test -p core-api --test flow three_devices_over_own_relay -- --ignored
        env:
          OWN_RELAY_URL: http://localhost:3340
      - name: Server logs
        if: failure()
        working-directory: server/deploy
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

