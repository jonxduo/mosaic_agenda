resource_types:
  - id: territory
    label: res.territory
    attributes:
      - { id: number, type: text, label: fld.territory_number, max_length: 20 }
      - { id: name, type: text, label: fld.territory_name, max_length: 120 }
      - { id: kind, type: choice, options: [residential, business, rural, other], label: fld.territory_kind }
      - { id: notes, type: long_text, label: fld.notes, max_length: 2000 }
      - { id: map, type: photos, max_count: 1, label: fld.map }
      - { id: location, type: geo, label: fld.location }
    holder_requires: { has_qualification: publisher }
    manager_role: territory_manager
    assistant_roles: [territory_assistant]
    log_fields:
      - { id: completed_on, type: date, label: fld.completed_on }
      - { id: notes, type: long_text, label: fld.notes, max_length: 1000 }
    requests:
      - { id: log_or_return, label: rq.log_or_return, answers: [logged, returned, not_yet], due: { days: 14 } }
      - { id: return, label: rq.return, answers: [returned], due: { days: 14 } }
    rules:
      max_per_holder: 3                                  # ⚙
      remind_holder_after_no_log: { days: 120 }          # ⚙
      alert_manager_not_worked: { days: 365 }            # ⚙
    read_audience:
      list: territory_team
      history: territory_team
      attachments_holder: true
    retention: { forever: true }                         # storico senza scadenza
    # La cartolina stampata (tutte uguali): raddrizzata a 1500×1000, ogni
    # campo sta in un riquadro fisso [x, y, larghezza, altezza].
    scan:
      width: 1500
      height: 1000
      language: ita
      boxes:
        - { field: name, at: [195, 140, 950, 65], read: line }
        - { field: number, at: [1260, 135, 220, 60], read: digits }
        - { field: map, at: [20, 230, 1460, 540], read: image }
        - { field: notes, at: [60, 862, 1100, 90], read: text }
        - { field: location, at: [1150, 650, 350, 350], read: code }
