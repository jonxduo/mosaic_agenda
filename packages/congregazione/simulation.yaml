# Popolazione fittizia per `cargo xtask simulate` (§15.3). Dati inventati.
# Il numero di persone è dato da --devices (un telefono per persona).
groups: 7
ios_share: 0.4                      # quota di telefoni iOS (push visibile, risveglio meno affidabile)
profiles:
  - { weight: 50, qualifications: [publisher, baptized, can_student], attributes: { sex: f } }
  - { weight: 12, qualifications: [publisher, can_student, can_bible_reading], attributes: { sex: m } }
  - { weight: 8,  qualifications: [publisher, baptized, regular_pioneer, can_student], attributes: { sex: f } }
  - { weight: 15, qualifications: [publisher, baptized, ministerial_servant, can_student, can_bible_reading, can_prayer,
                                   can_av, can_microphones, can_attendant, can_cbs_reader, can_wt_reader, can_treasures,
                                   can_gems, can_living, can_public_talk, can_public_chairman], attributes: { sex: m } }
  - { weight: 15, qualifications: [publisher, baptized, elder, can_prayer, can_lmm_chairman, can_public_chairman,
                                   can_public_talk, can_treasures, can_gems, can_living, can_cbs_conductor,
                                   can_attendant], attributes: { sex: m } }
# Incarichi assegnati a chi ne soddisfa i requisiti (per unità o uno per l'organizzazione).
roles:
  - { role: group_overseer, per_unit: true }
  - { role: group_assistant, per_unit: true }
  - { role: secretary }
  - { role: lmm_overseer }
  - { role: public_meeting_coordinator }
  - { role: board_manager }
  - { role: territory_manager }
# I titolari di questi incarichi hanno anche un desktop d'archivio sempre acceso.
archive_roles: [secretary]
