# Home e menu composti con le viste generiche del nucleo.
# Ordine e voci seguono il mockup di riferimento (Oggi, Rapporti, Gruppo, Programmi, Territori, Bacheca).
home:
  - view: my_documents_due
  - view: my_assignments
  - view: my_resources
    params: { resource_type: territory }
  - view: board

# Le schermate di gestione (persone, gruppi, incarichi, configurazione)
# compaiono solo a chi ha il permesso di agire: non serve visible_to.
menu:
  - { label: menu.home, view: home }
  - { label: menu.reports, view: my_documents, params: { form: service_report } }
  - { label: menu.group, view: unit_reports, params: { workflow: service_report, unit_type: group }, visible_to: group_leaders }
  - { label: menu.secretariat, view: work_queue, params: { workflow: service_report }, visible_to: secretariat }
  - { label: menu.summary, view: aggregate, params: { aggregate: monthly_summary }, visible_to: elders }
  - { label: menu.programs, view: program_list, params: { types: [midweek, weekend, av, attendants, cleaning, field_service] } }
  - { label: menu.territories, view: resource_list, params: { resource_type: territory }, visible_to: territory_team }
  - { label: menu.my_territories, view: my_resources, params: { resource_type: territory } }
  - { label: menu.board, view: board }
  - { label: menu.people, view: people }
  - { label: menu.units, view: units, params: { unit_type: group } }
  - { label: menu.roles, view: qualification_matrix,
      params: { qualifications: [can_attendant, can_cleaning, can_av, can_microphones, can_lmm_chairman, can_public_chairman,
                                 can_public_talk, can_treasures, can_gems, can_bible_reading, can_student, can_living,
                                 can_cbs_conductor, can_cbs_reader, can_wt_conductor, can_wt_reader, can_prayer] } }
  - { label: menu.alerts, view: admin_alerts, visible_to: app_admins }
  - { label: menu.sync, view: sync_status }
  - { label: menu.settings, view: settings }

# Riga di ogni persona nell'elenco (come la cartolina del proclamatore):
# date e attributi, poi le nomine e i servizi tenuti oggi.
people:
  attributes: [birth_date, sex, hope]
  dated_qualifications: [baptized]
  # Nella riga come etichette, nel modulo come caselle con data.
  qualifications: [elder, ministerial_servant, auxiliary_pioneer, regular_pioneer, special_pioneer, field_missionary]
  with_devices: [uses_app]

# "Il mio profilo": ciò che ognuno può cambiare di sé.
profile:
  given_name: given_name
  family_name: family_name
  fields: [birth_date, phone, email, address, emergency_name, emergency_phone, emergency_notes]
  dated_qualifications: [baptized]
  address: address
  countries: [it]
