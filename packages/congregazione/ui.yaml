# Home e menu composti con le viste generiche del nucleo.
# Ordine e voci seguono il mockup di riferimento (Oggi, Rapporti, Gruppo, Programmi, Territori, Bacheca).
home:
  - view: my_documents_due
  - view: my_assignments
  - view: my_resources
    params: { resource_type: territory }
  - view: board

menu:
  - { label: menu.home, view: home }
  - { label: menu.reports, view: my_documents, params: { form: service_report } }
  - { label: menu.group, view: work_queue, params: { workflow: service_report, unit_type: group }, visible_to: group_leaders }
  - { label: menu.secretariat, view: work_queue, params: { workflow: service_report }, visible_to: secretariat }
  - { label: menu.summary, view: aggregate, params: { aggregate: monthly_summary }, visible_to: elders }
  - { label: menu.programs, view: program_list, params: { types: [midweek, weekend, av, attendants, field_service] } }
  - { label: menu.territories, view: resource_list, params: { resource_type: territory }, visible_to: territory_team }
  - { label: menu.my_territories, view: my_resources, params: { resource_type: territory } }
  - { label: menu.board, view: board }
  - { label: menu.people, view: people, visible_to: app_admins }
  - { label: menu.units, view: units, params: { unit_type: group }, visible_to: app_admins }
  - { label: menu.roles, view: roles, visible_to: app_admins }
  - { label: menu.alerts, view: admin_alerts, visible_to: app_admins }
  - { label: menu.sync, view: sync_status }
  - { label: menu.settings, view: settings }

# Riga di ogni persona nell'elenco (come la cartolina del proclamatore):
# date e attributi, poi le nomine e i servizi tenuti oggi.
people:
  attributes: [birth_date, sex, hope]
  dated_qualifications: [baptized]
  qualifications: [elder, ministerial_servant, regular_pioneer, special_pioneer, field_missionary]
