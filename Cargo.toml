[workspace]
resolver = "3"
members = [
    "crates/core-model",
    "crates/core-config",
    "crates/core-crypto",
    "crates/core-events",
    "crates/core-engine",
    "crates/core-sync",
    "crates/core-api",
    "crates/core-push",
    "crates/core-scan",
    "server/push-service",
    "crates/core-testkit",
    "crates/xtask",
    "apps/app/src-tauri",
    "apps/app/src-tauri/plugins/secret-store",
]
# Everyday checks, tests and the dev server leave out the Tauri app (WebKit
# and friends): it is built when asked (`-p app`, `--workspace`, xtask).
default-members = [
    "crates/core-model",
    "crates/core-config",
    "crates/core-crypto",
    "crates/core-events",
    "crates/core-engine",
    "crates/core-sync",
    "crates/core-api",
    "crates/core-push",
    "crates/core-scan",
    "server/push-service",
    "crates/core-testkit",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
core-model = { path = "crates/core-model" }
core-config = { path = "crates/core-config" }
core-crypto = { path = "crates/core-crypto" }
core-events = { path = "crates/core-events" }
core-engine = { path = "crates/core-engine" }
core-testkit = { path = "crates/core-testkit" }
core-push = { path = "crates/core-push" }
push-service = { path = "server/push-service" }
tauri-plugin-secret-store = { path = "apps/app/src-tauri/plugins/secret-store" }
core-sync = { path = "crates/core-sync" }
core-api = { path = "crates/core-api" }
core-scan = { path = "crates/core-scan" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
serde_path_to_error = "0.1"
schemars = "1.2"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
blake3 = "1.8"
thiserror = "2.0"
anyhow = "1.0"
time = { version = "0.3", features = ["serde", "serde-human-readable", "macros", "parsing", "formatting"] }
data-encoding = "2.11"
getrandom = "0.4"
jsonschema = { version = "0.60", default-features = false }
clap = { version = "4.6", features = ["derive"] }
walkdir = "2.5"
proptest = "1.12"
tempfile = "3"
hex = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
ed25519-dalek = "3.0"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
crypto_box = { version = "0.9", features = ["seal", "std"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
url = "2"
regex = "1"
miniz_oxide = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
sha2 = "0.10"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
iroh = "1.4"
iroh-gossip = "0.101"
n0-future = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.25", default-features = false }
rqrr = "0.9"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-notification = "2.8"
tauri-plugin-biometric = "2"
tauri-plugin-dialog = "2"
tauri-plugin-barcode-scanner = "2"
keyring = "4.2"
axum = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The PIN key derivation (Argon2id, 64 MiB) is far too slow unoptimized.
# Debug builds keep line numbers for our crates (readable backtraces) and no
# debug info for dependencies: most of the size of target/ was debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Card scanning walks every pixel: unoptimized it takes seconds.
[profile.dev.package.core-scan]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.imageproc]
opt-level = 3

[profile.dev.package.rqrr]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# RSA key generation in the push-service tests.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
