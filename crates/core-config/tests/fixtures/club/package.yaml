id: club
version: 0.1.0
core_compat: ">=1.0, <2.0"
default_locale: en
locales: [en]
branding:
  app_name: app.name
  identifier: org.example.club
  icon: branding/icon.png
  primary_color: "#336699"
files: [qualifications.yaml, units.yaml, roles.yaml, audiences.yaml, forms.yaml, workflows.yaml,
        aggregates.yaml, calendar.yaml, programs.yaml, resources.yaml, board.yaml, notifications.yaml, ui.yaml]
person_attributes:
  - { id: level, type: integer, read_audience: all_members }
  - { id: size, type: choice, options: [s, l], read_audience: all_members }
privacy_notice: privacy/en.md
domain_terms: [forbiddenword]
