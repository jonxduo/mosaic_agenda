resource_types:
  - id: tool
    label: res.tool
    attributes:
      - { id: name, type: text }
      - { id: kind, type: choice, options: [a, { id: b, label: opt.kind_b }] }
      - { id: pic, type: photos, max_count: 1 }
      - { id: spot, type: geo }
    holder_requires: { has_qualification: member }
    manager_role: keeper
    log_fields: [ { id: used_on, type: date } ]
    requests:
      - { id: give_back, label: rq.give_back, answers: [returned], due: { days: 7 } }
    rules: { max_per_holder: 2 }
    read_audience: { list: keepers, history: keepers }
    scan:
      width: 600
      height: 400
      boxes:
        - { field: name, at: [50, 20, 300, 50] }
        - { field: pic, at: [50, 100, 500, 100], read: image }
        - { field: spot, at: [450, 250, 150, 150], read: code }
