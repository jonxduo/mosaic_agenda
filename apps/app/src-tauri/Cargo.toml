[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop and mobile shell: Tauri around core-api."

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
core-api.workspace = true
core-crypto.workspace = true
core-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
tauri.workspace = true
tauri-plugin-notification.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-plugin-secret-store.workspace = true
tauri-plugin-dialog.workspace = true

# Mobile: biometric unlock and QR scanning (PROGETTO.md §8.6, §9.5).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric.workspace = true
tauri-plugin-barcode-scanner.workspace = true

# Not used directly: pins libc for the whole build. From 0.2.190 libc drops
# the routing constants (`RTM_ADD`, `RTAX_*`) and `in6_ifreq` on iOS, and
# iroh's `netwatch`/`netdev` stop compiling (docs/DECISIONS.md, iOS).
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

# Android background sync (WorkManager → JNI).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Desktop keyring (macOS Keychain, Windows Credential Manager, Secret Service).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring.workspace = true

# Same as the workspace, except `unsafe_code` is `deny` instead of `forbid`:
# the Android JNI entry point (src/background.rs) needs `#[unsafe(no_mangle)]`
# and allows it there only.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
